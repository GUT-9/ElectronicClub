name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: club_test
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d club_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/club_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
  self-host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:self-host
      - run: npm run test:self-host
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, self-host]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deployment-packages-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:refresh
      - name: Publish changed packages only
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          if [ -z "$(git status --porcelain -- deployment-packages)" ]; then exit 0; fi
          git fetch origin main:refs/remotes/origin/main
          if [ "$(git rev-parse origin/main)" != "$EXPECTED_COMMIT" ]; then
            echo 'main advanced; refusing to overwrite newer work. The next push will process the pending release intent.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment-packages
          git commit -m 'build: refresh changed deployment packages [skip ci]'
          git push origin HEAD:main
