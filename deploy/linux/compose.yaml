name: ${CLUB_PROJECT:-electronicclub}
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    network_mode: none
    environment:
      POSTGRES_DB: electronicclub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    command: [postgres, -c, listen_addresses=, -c, unix_socket_directories=/var/run/postgresql, -c, unix_socket_permissions=0777, -c, hba_file=/etc/postgresql/pg_hba.conf]
    secrets: [db_password]
    volumes:
      - ${CLUB_STATE_DIR}/postgres:/var/lib/postgresql/data
      - pg_socket:/var/run/postgresql
      - ${ECLUB_RELEASE_DIR}/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
  api:
    image: electronicclub-api:${ECLUB_RELEASE_ID}
    build:
      context: ${ECLUB_RELEASE_DIR}
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment: &api_environment
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:?configure the public origin}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
      PG_SOCKET_DIR: /var/run/postgresql
      QINIU_ACCESS_KEY: ${QINIU_ACCESS_KEY:-}
      QINIU_SECRET_KEY: ${QINIU_SECRET_KEY:-}
      QINIU_BUCKET: ${QINIU_BUCKET:-edwell-k12}
      QINIU_DOWNLOAD_DOMAIN: ${QINIU_DOWNLOAD_DOMAIN:-https://oss.gut9.cn}
      QINIU_RESOURCE_MAX_BYTES: ${QINIU_RESOURCE_MAX_BYTES:-52428800}
      QINIU_RESOURCE_BUDGET_BYTES: ${QINIU_RESOURCE_BUDGET_BYTES:-134217728}
      PUBLIC_SITE_MODE: ${PUBLIC_SITE_MODE:-database}
      PUBLIC_SITE_ORIGIN: ${PUBLIC_SITE_ORIGIN:-}
      PG_POINTS_PER_CORE_SECOND: ${PG_POINTS_PER_CORE_SECOND:-}
    secrets: [app_password, proxy_token]
    volumes:
      - pg_socket:/var/run/postgresql:ro
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/internal/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    image: electronicclub-web:${ECLUB_RELEASE_ID}
    build:
      context: ${ECLUB_RELEASE_DIR}
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?configure the HTTPS domain}
      TLS_DIRECTIVE: ${TLS_DIRECTIVE:-}
      NO_PROXY: api,localhost,127.0.0.1
    secrets: [proxy_token]
    ports:
      - ${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80
      - ${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443
    volumes:
      - ${CLUB_STATE_DIR}/caddy:/data
      - ${CLUB_STATE_DIR}/caddy-config:/config
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -Y, "off", -q, -O, /dev/null, http://127.0.0.1:8080/ready]
      interval: 5s
      timeout: 3s
      retries: 20
  admin:
    profiles: [ops]
    image: electronicclub-api:${ECLUB_RELEASE_ID}
    environment: *api_environment
    entrypoint: [node, /app/admin.mjs]
    secrets: [db_password, app_password]
    volumes:
      - pg_socket:/var/run/postgresql:ro
      - ${ECLUB_RELEASE_DIR}/sql:/app/sql:ro
      - ${ECLUB_TOOLS_DIR}/admin.mjs:/app/admin.mjs:ro
  crypto:
    profiles: [ops]
    image: electronicclub-api:${ECLUB_RELEASE_ID}
    entrypoint: [node, /app/crypto.mjs]
    secrets: [backup_key]
    volumes:
      - ${ECLUB_TOOLS_DIR}/crypto.mjs:/app/crypto.mjs:ro
    network_mode: none
secrets:
  db_password: {file: "${CLUB_STATE_DIR}/secrets/db_password"}
  app_password: {file: "${CLUB_STATE_DIR}/secrets/app_password"}
  proxy_token: {file: "${CLUB_STATE_DIR}/secrets/proxy_token"}
  backup_key: {file: "${CLUB_STATE_DIR}/secrets/backup_key"}
volumes:
  pg_socket:
